<body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col">
  <header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="h-20 max-w-7xl mx-auto px-gutter flex items-center justify-between">
      <a class="flex items-center gap-space-sm" href="index.html">
        <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center">
          <span class="material-symbols-outlined text-on-primary text-[24px]">home</span>
        </div>
        <div class="flex flex-col">
          <span class="font-headline-sm text-headline-sm text-primary tracking-tight">DH 골드 부동산</span>
          <span class="font-label-sm text-label-sm text-outline">부평 전문 공인중개사사무소</span>
        </div>
      </a>
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-body-md text-on-surface-variant hover:text-on-surface transition-colors py-space-sm min-h-[44px] flex items-center">
          홈으로 가기
        </a>
        <a href="news.html" class="text-body-md text-on-surface-variant hover:text-on-surface transition-colors py-space-sm min-h-[44px] flex items-center">
          게시판 보기
        </a>
      </div>
    </div>
  </header>

  <main class="w-full pt-28 pb-16 flex-grow flex flex-col items-center justify-center px-gutter">
    <div id="login-section" class="w-full max-w-md bg-surface-container-low p-8 rounded-3xl shadow-lg border border-outline-variant/30 flex flex-col gap-6">
      <div class="flex flex-col items-center text-center gap-2">
        <div class="w-14 h-14 rounded-2xl bg-primary flex items-center justify-center text-on-primary mb-2 shadow-sm">
          <span class="material-symbols-outlined text-[30px]">lock</span>
        </div>
        <h1 class="font-headline-sm text-2xl font-bold text-on-surface">관리자 로그인</h1>
        <p class="text-xs text-on-surface-variant">게시글 관리 및 시스템 접근을 위해 비밀번호를 입력해 주세요.</p>
      </div>

      <form id="login-form" class="flex flex-col gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-bold text-on-surface">관리자 비밀번호</label>
          <input id="password-input" type="password" required class="bg-sand px-4 py-3 rounded-xl border border-outline-variant/30 font-body-md text-on-surface focus:outline-none focus:border-primary min-h-[44px]" placeholder="비밀번호 입력">
        </div>
        <div id="login-error" class="hidden text-xs text-error font-bold text-center">
          비밀번호가 올바르지 않습니다.
        </div>
        <button type="submit" class="w-full bg-primary hover:bg-primary-container text-on-primary py-3.5 rounded-xl font-bold text-sm transition-all shadow-md min-h-[48px] flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-[18px]">login</span>
          <span>로그인</span>
        </button>
      </form>
    </div>

    <div id="dashboard-section" class="hidden w-full max-w-6xl flex-col gap-6">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-surface-container-low p-6 rounded-3xl shadow-sm">
        <div class="flex flex-col">
          <span class="text-xs font-bold text-primary">ADMIN DASHBOARD</span>
          <h1 class="font-headline-sm text-2xl font-bold text-on-surface">게시글 관리 대시보드</h1>
        </div>
        <div class="flex items-center gap-3">
          <a href="news-write.html" class="bg-primary hover:bg-primary-container text-on-primary px-5 py-2.5 rounded-xl text-sm font-bold transition-all shadow-sm flex items-center gap-2 min-h-[44px]">
            <span class="material-symbols-outlined text-[18px]">edit_note</span>
            <span>새 글 작성</span>
          </a>
          <button id="logout-btn" class="bg-sand hover:bg-surface-container-high text-on-surface px-4 py-2.5 rounded-xl text-sm font-bold transition-colors min-h-[44px] flex items-center gap-1">
            <span class="material-symbols-outlined text-[18px]">logout</span>
            <span>로그아웃</span>
          </button>
        </div>
      </div>

      <div class="bg-surface-container-low rounded-3xl shadow-sm overflow-hidden border border-outline-variant/30">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse min-w-[650px]">

              <tr class="border-b border-outline-variant/30 bg-surface-container text-xs font-bold text-outline">

                <th class="py-4 px-6">제목</th>
                <th class="py-4 px-6 w-28 text-center">작성일</th>
                <th class="py-4 px-6 w-36 text-center">관리</th>
              </tr>
            </thead>
            <tbody id="posts-table-body" class="divide-y divide-outline-variant/20 text-sm">
              <tr>
                <td colspan="5" class="py-12 text-center text-outline">데이터를 불러오는 중입니다...</td>

  <footer class="w-full bg-surface-container-low py-6 border-t border-outline-variant/20">

      <span>DH 골드 부동산 관리자 시스템</span>
      <span>&copy; 2025 DH골드부동산</span>
    </div>
  </footer>

  <script src="db.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (isAdmin()) {
        showDashboard();
      } else {
        showLogin();
      }

      const loginForm = document.getElementById('login-form');
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorElem = document.getElementById('login-error');
        errorElem.classList.add('hidden');

        const inputPw = document.getElementById('password-input').value.trim();
        const config = await loadConfig();
        const expectedPw = config.admin_password || 'admin1234';

        if (inputPw === expectedPw) {
          sessionStorage.setItem('isAdmin', 'true');
          location.reload();
        } else {
          errorElem.classList.remove('hidden');
        }
      });

      const logoutBtn = document.getElementById('logout-btn');
      logoutBtn.addEventListener('click', () => {
        sessionStorage.removeItem('isAdmin');
        location.reload();
      });
    });

    function showLogin() {
      document.getElementById('login-section').classList.remove('hidden');
      document.getElementById('dashboard-section').classList.add('hidden');
    }

    async function showDashboard() {
      document.getElementById('login-section').classList.add('hidden');
      const dash = document.getElementById('dashboard-section');
      dash.classList.remove('hidden');
      dash.classList.add('flex');

      await renderTable();
    }

    async function renderTable() {
      const posts = await getPosts();
      const tbody = document.getElementById('posts-table-body');

      if (!posts || posts.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-12 text-center text-outline font-bold">
              작성된 게시글이 없습니다.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = posts.map((post, index) => `
        <tr class="hover:bg-surface-container transition-colors">
          <td class="py-4 px-6 text-center font-bold text-outline">${posts.length - index}</td>
          <td class="py-4 px-6">
            <span class="px-2.5 py-1 rounded-md bg-primary-fixed text-on-primary-fixed text-xs font-bold whitespace-nowrap">
              ${escapeHtml(post.category || '일반')}
            </span>
          </td>
          <td class="py-4 px-6 font-bold text-on-surface">
            <a href="news-detail.html?id=${encodeURIComponent(post.id)}" class="hover:text-primary transition-colors line-clamp-1">
              ${escapeHtml(post.title)}
            </a>
          </td>
          <td class="py-4 px-6 text-center text-xs text-outline whitespace-nowrap">${escapeHtml(post.date || '')}</td>
          <td class="py-4 px-6 text-center whitespace-nowrap">
            <div class="inline-flex items-center gap-1.5">
              <a href="news-write.html?id=${encodeURIComponent(post.id)}" class="px-3 py-1.5 rounded-lg bg-surface text-primary text-xs font-bold hover:bg-primary hover:text-on-primary transition-colors border border-outline-variant/30 min-h-[36px] flex items-center">
                수정
              </a>
              <button onclick="handleDelete('${escapeHtml(post.id)}')" class="px-3 py-1.5 rounded-lg bg-error-container text-on-error-container text-xs font-bold hover:bg-error hover:text-on-error transition-colors min-h-[36px] flex items-center">
                삭제
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function handleDelete(id) {
      if (confirm('정말로 이 게시글을 삭제하시겠습니까?')) {
        await deletePost(id);
        await renderTable();
      }
    }
  </script>
