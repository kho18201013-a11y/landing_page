<body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col pb-24 md:pb-12">
  <script src="db.js"></script>
  <script>
    requireAdmin();
  </script>

  <header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="h-20 max-w-7xl mx-auto px-gutter flex items-center justify-between">
      <a class="flex items-center gap-space-sm" href="admin.html">
        <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center">
          <span class="material-symbols-outlined text-on-primary text-[24px]">manage_accounts</span>
        </div>
        <div class="flex flex-col">
          <span class="font-headline-sm text-headline-sm text-primary tracking-tight">게시글 작성/수정</span>
          <span class="font-label-sm text-label-sm text-outline">DH 골드 부동산 관리자</span>
        </div>
      </a>
      <div class="flex items-center gap-3">
        <a href="admin.html" class="px-4 py-2 rounded-xl bg-sand text-on-surface text-sm font-bold hover:bg-surface-container-high transition-colors min-h-[44px] flex items-center">
          대시보드로 복귀
        </a>
      </div>
    </div>
  </header>

  <main class="w-full pt-28 max-w-4xl mx-auto px-gutter flex-grow">
    <div class="bg-surface-container-low p-6 md:p-10 rounded-3xl shadow-sm flex flex-col gap-6">
      <div class="flex items-center justify-between border-b border-outline-variant/30 pb-4">
        <h1 id="page-title" class="font-headline-sm text-2xl font-bold text-on-surface">새 소식 작성</h1>
        <span class="text-xs text-outline">* 표시는 필수 항목입니다</span>
      </div>

      <form id="write-form" class="flex flex-col gap-5">
        <input type="hidden" id="post-id">

        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-bold text-on-surface">카테고리 *</label>
          <select id="post-category" required class="bg-sand px-4 py-3 rounded-xl border border-outline-variant/30 font-body-md text-on-surface focus:outline-none focus:border-primary min-h-[44px]">
            <option value="부평구 정책/호재">부평구 정책/호재</option>
            <option value="부동산 상식">부동산 상식</option>
            <option value="공인중개사 소식">공인중개사 소식</option>
            <option value="일반">일반</option>
          </select>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-bold text-on-surface">제목 *</label>
          <input id="post-title" required class="bg-sand px-4 py-3 rounded-xl border border-outline-variant/30 font-body-md text-on-surface focus:outline-none focus:border-primary min-h-[44px]" placeholder="게시글 제목을 입력하세요" type="text">
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-bold text-on-surface">대표 이미지 URL (선택사항)</label>
          <input id="post-image" class="bg-sand px-4 py-3 rounded-xl border border-outline-variant/30 font-body-md text-on-surface focus:outline-none focus:border-primary min-h-[44px]" placeholder="https://... (비워두실 경우 기본 이미지가 적용됩니다)" type="url">
        </div>

        <div class="flex flex-col gap-1.5">
          <div class="flex items-center justify-between">
            <label class="text-sm font-bold text-on-surface">본문 내용 (마크다운 지원) *</label>
            <button type="button" id="preview-toggle-btn" class="text-xs font-bold text-primary hover:underline">
              미리보기 전환
            </button>
          </div>
          <textarea id="post-content" required rows="14" class="bg-sand p-4 rounded-xl border border-outline-variant/30 font-mono text-sm text-on-surface focus:outline-none focus:border-primary resize-y" placeholder="# 큰 제목&#10;## 중간 제목&#10;- 목록 1&#10;- 목록 2&#10;&#10;**굵은 글씨**나 [링크](https://...)도 지원됩니다."></textarea>
          <div id="preview-area" class="hidden bg-surface p-6 rounded-xl border border-outline-variant/30 min-h-[300px]"></div>
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-outline-variant/30">
          <button type="button" onclick="location.href='admin.html'" class="px-6 py-3 rounded-xl bg-sand text-on-surface font-bold text-sm hover:bg-surface-container-high transition-colors min-h-[48px]">
            취소
          </button>
          <button type="submit" id="submit-btn" class="px-8 py-3 rounded-xl bg-primary text-on-primary font-bold text-sm hover:bg-primary-container transition-colors shadow-md min-h-[48px] flex items-center gap-2">
            <span class="material-symbols-outlined text-[18px]">save</span>
            <span>게시글 저장</span>
          </button>
        </div>
      </form>
    </div>
  </main>

  <script>
    let isEditing = false;
    let editId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      editId = params.get('id');

      if (editId) {
        isEditing = true;
        document.getElementById('page-title').textContent = '게시글 수정';
        const post = await getPost(editId);
        if (post) {
          document.getElementById('post-id').value = post.id;
          document.getElementById('post-title').value = post.title || '';
          document.getElementById('post-category').value = post.category || '공인중개사 소식';
          document.getElementById('post-image').value = post.image || '';
          document.getElementById('post-content').value = post.content || '';
        } else {
          alert('수정할 게시글을 찾을 수 없습니다.');
          location.href = 'admin.html';
        }
      }

      const previewToggleBtn = document.getElementById('preview-toggle-btn');
      const contentTextarea = document.getElementById('post-content');
      const previewArea = document.getElementById('preview-area');
      let showingPreview = false;

      previewToggleBtn.addEventListener('click', () => {
        showingPreview = !showingPreview;
        if (showingPreview) {
          previewArea.innerHTML = renderMarkdown(contentTextarea.value);
          previewArea.classList.remove('hidden');
          contentTextarea.classList.add('hidden');
          previewToggleBtn.textContent = '편집기로 돌아가기';
        } else {
          previewArea.classList.add('hidden');
          contentTextarea.classList.remove('hidden');
          previewToggleBtn.textContent = '미리보기 전환';
        }
      });

      const form = document.getElementById('write-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">sync</span> 저장 중...';

        const postData = {
          id: editId || undefined,
          title: document.getElementById('post-title').value.trim(),
          category: document.getElementById('post-category').value,
          image: document.getElementById('post-image').value.trim(),
          content: document.getElementById('post-content').value
        };

        try {
          const saved = await savePost(postData);
          alert('게시글이 성공적으로 저장되었습니다!');
          location.href = `news-detail.html?id=${encodeURIComponent(saved.id)}`;
        } catch (err) {
          alert('저장 중 오류가 발생했습니다: ' + err.message);
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">save</span> <span>게시글 저장</span>';
        }
      });
    });
  </script>
</body>
</html>
